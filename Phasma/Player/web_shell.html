<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phasma</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  /* CSS sizes the canvas: SDL reads its size at startup and after every window resize (a resizable window). */
  #canvas {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    outline: none;
  }

  #status {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9aa4b2;
    font: 14px system-ui, sans-serif;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="status">Loading...</div>
<script>
  // Inside a function, so no page name can clash with a global in PhasmaPlayer.js.
  var Module = (() => {
    const statusElement = document.getElementById("status");
    const canvasElement = document.getElementById("canvas");
    canvasElement.addEventListener("contextmenu", (event) => event.preventDefault());

    // A reason the game cannot run stays on screen over Emscripten's progress messages.
    let stopReason = navigator.gpu ? "" : "This browser does not support WebGPU.";

    const showStatus = (text) => {
      const shown = stopReason || text;
      statusElement.textContent = shown;
      statusElement.style.display = shown ? "flex" : "none";
    };

    // miniaudio resumes its AudioContext on click and touchend only, so a keyboard-only player heard nothing. Its
    // unlock also drops those listeners even when the browser refuses, so call it only on a key that is a user gesture
    // (Escape is not), once the engine has created its audio.
    const unlockAudio = () => {
      const gesture = !navigator.userActivation || navigator.userActivation.isActive;
      if (window.miniaudio && gesture) {
        window.miniaudio.unlock();
        document.removeEventListener("keydown", unlockAudio, true);
      }
    };
    document.addEventListener("keydown", unlockAudio, true);

    showStatus("Loading...");
    return {
      canvas: canvasElement,
      print: (...args) => console.log(...args),
      printErr: (...args) => console.error(...args),
      setStatus: showStatus,
      onAbort: (what) => {
        stopReason = "The game stopped: " + what;
        showStatus("");
      },
    };
  })();
</script>
{{{ SCRIPT }}}
</body>
</html>
