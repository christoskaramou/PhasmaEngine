name: Phasma prebuilds

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build_phasma:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}}

    - name: Prepare release package
      run: |
        $ErrorActionPreference = "Stop"

        $runtime = Join-Path "${{ github.workspace }}" "build\${{ env.BUILD_TYPE }}"
        $outDir = Join-Path "${{ github.workspace }}" "release-packages"
        New-Item -ItemType Directory -Force -Path $outDir | Out-Null

        $stage = Join-Path $outDir "PhasmaEngine-Full-Windows"
        if (Test-Path $stage) {
          Remove-Item -Recurse -Force $stage
        }
        New-Item -ItemType Directory -Force -Path $stage | Out-Null

        Copy-Item -Path (Join-Path $runtime "*") -Destination $stage -Recurse -Force
        Remove-Item -Force -ErrorAction SilentlyContinue `
          (Join-Path $stage "PhasmaEngine.log"), `
          (Join-Path $stage "PhasmaEditorModule_*.dll"), `
          (Join-Path $stage "*.pid"), `
          (Join-Path $stage "*.tmp")
        Remove-Item -Recurse -Force -ErrorAction SilentlyContinue `
          (Join-Path $stage "cargo\build"), `
          (Join-Path $stage "_codex_visual")

        Set-Content -Path (Join-Path $stage "Launch-PhasmaLauncher.cmd") -Encoding ascii -Value @"
        @echo off
        cd /d "%~dp0"
        PhasmaLauncher.exe %*
        "@

        Set-Content -Path (Join-Path $stage "Launch-PhasmaEditor.cmd") -Encoding ascii -Value @"
        @echo off
        cd /d "%~dp0"
        PhasmaEditor.exe %*
        "@

        Set-Content -Path (Join-Path $stage "Launch-PhasmaPlayer.cmd") -Encoding ascii -Value @"
        @echo off
        cd /d "%~dp0"
        PhasmaPlayer.exe %*
        "@

        $readme = @"
        PhasmaEngine Full Windows prebuild

        Run:
          Launch-PhasmaLauncher.cmd

        Included:
          PhasmaLauncher, PhasmaEditor, PhasmaPlayer, PhasmaCore, PhasmaRuntime,
          PhasmaWebGPU, physics/audio support, shaders, sample scenes, and assets.

        Backends:
          Vulkan and DX12 are both included. Pick the backend in PhasmaLauncher,
          or run PhasmaEditor.exe / PhasmaPlayer.exe with --api vulkan or --api dx12.

        DX12 is Windows-only.
        "@
        Set-Content -Path (Join-Path $stage "README_RELEASE.txt") -Value $readme -Encoding ascii

        $zip = Join-Path $outDir "PhasmaEngine-Full-Windows.zip"
        Remove-Item -Force -ErrorAction SilentlyContinue $zip
        Compress-Archive -Path $stage -DestinationPath $zip -Force

    - name: Upload artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: PhasmaEngine-Windows-Prebuilds
        path: ${{github.workspace}}/release-packages/*.zip
        if-no-files-found: error

  build_linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Install Linux build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ninja-build \
          libasound2-dev \
          libdbus-1-dev \
          libegl1-mesa-dev \
          libgl1-mesa-dev \
          libibus-1.0-dev \
          libpulse-dev \
          libudev-dev \
          libwayland-dev \
          libx11-dev \
          libxcursor-dev \
          libxext-dev \
          libxfixes-dev \
          libxi-dev \
          libxinerama-dev \
          libxkbcommon-dev \
          libxrandr-dev \
          libxrender-dev \
          libxss-dev \
          libxxf86vm-dev

    - name: Configure CMake
      run: cmake -S ${{github.workspace}} -B ${{github.workspace}}/build -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}}

    - name: Prepare release package
      run: |
        set -euo pipefail

        runtime="${{ github.workspace }}/build/${{ env.BUILD_TYPE }}"
        out_dir="${{ github.workspace }}/release-packages"
        stage="${out_dir}/PhasmaEngine-Full-Linux"

        rm -rf "$stage"
        mkdir -p "$stage"
        cp -a "$runtime"/. "$stage"/
        rm -f "$stage"/PhasmaEngine.log "$stage"/libPhasmaEditorModule_*.so
        rm -rf "$stage"/cargo/build "$stage"/_codex_visual

        cp -a "${{ github.workspace }}"/PhasmaCore/Libs/assimp/libassimp.so* "$stage"/
        cp -a "${{ github.workspace }}"/PhasmaCore/Libs/dx/libdxcompiler.so "$stage"/
        cp -a "${{ github.workspace }}"/PhasmaCore/Libs/spirv/libshaderc_shared.so* "$stage"/
        cp -a "${{ github.workspace }}"/PhasmaCore/Libs/vulkan/libvulkan.so* "$stage"/

        cat > "$stage/Launch-PhasmaLauncher.sh" <<'SH'
        #!/usr/bin/env bash
        set -e
        SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
        export LD_LIBRARY_PATH="$SCRIPT_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        exec "$SCRIPT_DIR/PhasmaLauncher" "$@"
        SH

        cat > "$stage/Launch-PhasmaEditor-Vulkan.sh" <<'SH'
        #!/usr/bin/env bash
        set -e
        SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
        export LD_LIBRARY_PATH="$SCRIPT_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        exec "$SCRIPT_DIR/PhasmaEditor" --api vulkan "$@"
        SH

        cat > "$stage/Launch-PhasmaPlayer-Vulkan.sh" <<'SH'
        #!/usr/bin/env bash
        set -e
        SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
        export LD_LIBRARY_PATH="$SCRIPT_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        exec "$SCRIPT_DIR/PhasmaPlayer" --api vulkan "$@"
        SH
        chmod +x "$stage/Launch-PhasmaLauncher.sh" \
          "$stage/Launch-PhasmaEditor-Vulkan.sh" \
          "$stage/Launch-PhasmaPlayer-Vulkan.sh" \
          "$stage/PhasmaLauncher" \
          "$stage/PhasmaEditor" \
          "$stage/PhasmaPlayer"

        cat > "$stage/README_RELEASE.txt" <<'TXT'
        PhasmaEngine Full Linux prebuild

        Run:
          ./Launch-PhasmaLauncher.sh

        Direct launch:
          ./Launch-PhasmaEditor-Vulkan.sh
          ./Launch-PhasmaPlayer-Vulkan.sh

        Backend:
          Vulkan

        Included:
          PhasmaLauncher, PhasmaEditor, PhasmaPlayer, PhasmaCore, PhasmaRuntime,
          PhasmaWebGPU, physics/audio support, shaders, sample scenes, and assets.

        DX12 is Windows-only, so this Linux package ships Vulkan only.
        TXT

        tar -C "$out_dir" -czf "$out_dir/PhasmaEngine-Full-Linux.tar.gz" "PhasmaEngine-Full-Linux"

    - name: Upload artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: PhasmaEngine-Linux-Prebuilds
        path: ${{github.workspace}}/release-packages/*.tar.gz
        if-no-files-found: error

  pre-release:
    name: "release"
    runs-on: "windows-latest"
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    concurrency:
      group: release-latest
      cancel-in-progress: true
    needs:
      - build_phasma
      - build_linux
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download Windows release packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: PhasmaEngine-Windows-Prebuilds
          path: release-packages

      - name: Download Linux release packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: PhasmaEngine-Linux-Prebuilds
          path: release-packages

      - name: Automatic Release
        uses: "marvinpinto/action-automatic-releases@d68defdd11f9dcc7f52f35c1b7c236ee7513bcc1" # latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: true
          title: "Development Build"
          files: |
            release-packages/PhasmaEngine-Full-Windows.zip
            release-packages/PhasmaEngine-Full-Linux.tar.gz
            LICENSE
