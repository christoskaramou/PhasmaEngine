name: Phasma prebuilds

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build_phasma:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        persist-credentials: false

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}}

    - name: Prepare release package
      run: |
        $ErrorActionPreference = "Stop"

        $outDir = Join-Path "${{ github.workspace }}" "release-packages"
        New-Item -ItemType Directory -Force -Path $outDir | Out-Null

        $stage = Join-Path $outDir "PhasmaEngine-Full-Windows"
        if (Test-Path $stage) {
          Remove-Item -Recurse -Force $stage
        }
        cmake --install "${{ github.workspace }}/build" --config "${{ env.BUILD_TYPE }}" --component Runtime --prefix $stage

        $zip = Join-Path $outDir "PhasmaEngine-Full-Windows.zip"
        Remove-Item -Force -ErrorAction SilentlyContinue $zip
        Compress-Archive -Path $stage -DestinationPath $zip -Force

    - name: Upload artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: PhasmaEngine-Windows-Prebuilds
        path: ${{github.workspace}}/release-packages/*.zip
        if-no-files-found: error

  build_linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        persist-credentials: false

    - name: Install Linux build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ninja-build \
          libasound2-dev \
          libdbus-1-dev \
          libegl1-mesa-dev \
          libgl1-mesa-dev \
          libibus-1.0-dev \
          libpulse-dev \
          libudev-dev \
          libwayland-dev \
          libx11-dev \
          libxcursor-dev \
          libxext-dev \
          libxfixes-dev \
          libxi-dev \
          libxinerama-dev \
          libxkbcommon-dev \
          libxrandr-dev \
          libxrender-dev \
          libxss-dev \
          libxxf86vm-dev

    - name: Configure CMake
      run: cmake -S ${{github.workspace}} -B ${{github.workspace}}/build -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}}

    - name: Prepare release package
      run: |
        set -euo pipefail

        out_dir="${{ github.workspace }}/release-packages"
        stage="${out_dir}/PhasmaEngine-Full-Linux"

        rm -rf "$stage"
        mkdir -p "$stage"
        cmake --install "${{ github.workspace }}/build" --config "${{ env.BUILD_TYPE }}" --component Runtime --prefix "$stage"

        tar -C "$out_dir" -czf "$out_dir/PhasmaEngine-Full-Linux.tar.gz" "PhasmaEngine-Full-Linux"

    - name: Upload artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: PhasmaEngine-Linux-Prebuilds
        path: ${{github.workspace}}/release-packages/*.tar.gz
        if-no-files-found: error

  pre-release:
    name: "release"
    runs-on: "windows-latest"
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    concurrency:
      group: release-latest
      cancel-in-progress: true
    needs:
      - build_phasma
      - build_linux
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Download Windows release packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: PhasmaEngine-Windows-Prebuilds
          path: release-packages

      - name: Download Linux release packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: PhasmaEngine-Linux-Prebuilds
          path: release-packages

      - name: Automatic Release
        uses: "marvinpinto/action-automatic-releases@d68defdd11f9dcc7f52f35c1b7c236ee7513bcc1" # latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: true
          title: "Development Build"
          files: |
            release-packages/PhasmaEngine-Full-Windows.zip
            release-packages/PhasmaEngine-Full-Linux.tar.gz
            LICENSE
